  <script>

        extend: {

  <style>
    /* CSS Reset and Mobile Polish */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
      background-color: #1a0105;
    }

    /* Festival-Themed Backgrounds with Smooth Transitions */
    .bg-festival-0 {
      background: linear-gradient(145deg, #180206 0%, #380512 35%, #580d1d 70%, #7c220a 100%);
    }
    .bg-festival-1 {
      /* Deep Diwali Night with Golden Flame Glow */
      background: linear-gradient(145deg, #160205 0%, #3e0712 25%, #6a1415 50%, #99310c 75%, #b45309 100%);
    }
    .bg-festival-2 {
      /* Sacred Govardhan Emerald Green & Nature Forest Teal */
      background: linear-gradient(145deg, #01140e 0%, #043627 25%, #064e3b 50%, #065f46 75%, #0c3e2f 100%);
    }
    .bg-festival-3 {
      /* Auspicious Bhai Dooj Crimson Red, Rose Pink & Tilak Gold */
      background: linear-gradient(145deg, #1f020c 0%, #3e0517 25%, #690c2a 50%, #881337 75%, #9f1239 100%);
    }
    .bg-festival-memory {
      /* Royal Velvet Wine, Rose Gold & Nostalgic Warmth for Family Memories */
      background: linear-gradient(145deg, #180512 0%, #2e0821 25%, #4a0e36 50%, #340825 75%, #180313 100%);
    }

    .festival-bg-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      transition: background 1.2s ease-in-out;
    }

    /* Glassmorphism Classes */
    .glass-box {
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.45);
    }
    .glass-btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.20);
      border-color: rgba(251, 191, 36, 0.6);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
    }
    .glass-btn:active {
      transform: scale(0.97);
    }

    /* Step Transition: Smooth Fade-In + Slide-Up */
    .step-transition {
      animation: stepFadeSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes stepFadeSlide {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Vertical Floating Emojis Animation */
    @keyframes floatUpwards {
      0% {
        transform: translateY(105vh) translateX(0) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.9;
      }
      85% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-10vh) translateX(25px) scale(1.15) rotate(360deg);
        opacity: 0;
      }
    }
    .floating-particle {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      will-change: transform, opacity;
      animation-name: floatUpwards;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    /* Glowing Circular Gold Photo Frame */
    .glowing-circular-frame {
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.7), 0 0 50px rgba(234, 88, 12, 0.5);
      animation: pulseGlow 2.5s infinite alternate ease-in-out;
    }

    /* Animated equalizer wave bars */
    .eq-bar {
      width: 3px;
      background-color: #facc15;
      border-radius: 9999px;
      animation: eqDance 0.8s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(1) { animation-delay: 0.1s; height: 12px; }
    .eq-bar:nth-child(2) { animation-delay: 0.3s; height: 18px; }
    .eq-bar:nth-child(3) { animation-delay: 0.5s; height: 10px; }
    @keyframes eqDance {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }
  </style>
</head>

    // =========================================================================
    // Web Audio Synthesizer Fallback: 
    // Guarantees soothing Indian festive sitar melody if external audio is blocked
    // =========================================================================
    class FestiveMelodySynthesizer {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.interval = null;
        this.notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playChime(freq, time, duration = 1.3) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, time);

        // Harmonics
        const overtone = this.ctx.createOscillator();
        const overtoneGain = this.ctx.createGain();
        overtone.type = 'triangle';
        overtone.frequency.setValueAtTime(freq * 2, time);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.exponentialRampToValueAtTime(0.07, time + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        overtoneGain.gain.setValueAtTime(0.001, time);
        overtoneGain.gain.exponentialRampToValueAtTime(0.03, time + 0.05);
        overtoneGain.gain.exponentialRampToValueAtTime(0.0001, time + duration * 0.8);

        osc.connect(gain);
        overtone.connect(overtoneGain);
        gain.connect(this.ctx.destination);
        overtoneGain.connect(this.ctx.destination);

        osc.start(time);
        overtone.start(time);
        osc.stop(time + duration);
        overtone.stop(time + duration);
      }
      start() {
        this.init();
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (this.isPlaying) return;
        this.isPlaying = true;

        let step = 0;
        const melody = [0, 2, 4, 3, 5, 4, 2, 0, 4, 5, 7, 5, 4, 2, 1, 0];
        const tick = () => {
          if (!this.isPlaying || !this.ctx) return;
          const now = this.ctx.currentTime;
          const noteIndex = melody[step % melody.length];
          const freq = this.notes[noteIndex] || 329.63;
          this.playChime(freq, now, 1.4);
          if (step % 4 === 0) {
            this.playChime(130.81, now, 2.5); // Drone
          }
          step++;
        };
        tick();
        this.interval = setInterval(tick, 450);
      }
      stop() {
        this.isPlaying = false;
        if (this.interval) {
          clearInterval(this.interval);
          this.interval = null;
        }
      }
    }

    const synthPlayer = new FestiveMelodySynthesizer();

    // =========================================================================
    // MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // 1. STATE TRACKING: currentStep (0, 1, 2, 3) and selectedUser
      const [currentStep, setCurrentStep] = useState(0);
      const [selectedUser, setSelectedUser] = useState(null);

      // Audio state
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const audioRef = useRef(null);

      // Initialize global audio element
      useEffect(() => {
        const audio = new Audio();
        audio.loop = true;
        audio.preload = 'auto';

        // Fallback to soothing melody synthesizer if audio link fails or is CORS-blocked
        audio.addEventListener('error', () => {
          console.warn('Audio URL fallback: Starting Festive Melody Synthesizer.');
          if (isPlaying && !isMuted) {
            synthPlayer.start();
          }
        });

        audioRef.current = audio;

        return () => {
          audio.pause();
          synthPlayer.stop();
        };
      }, []);

      // Function to start playing the selected user's song
      const startUserAudio = (user) => {
        const audioUrl = user?.audio || FAMILY_DATA[0].audio;
        if (audioRef.current) {
          audioRef.current.src = audioUrl;
          audioRef.current.muted = isMuted;
          const playPromise = audioRef.current.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => setIsPlaying(true))
              .catch((err) => {
                console.log('Autoplay restriction or audio failure, fallback synth activated:', err);
                synthPlayer.start();
                setIsPlaying(true);
              });
          }
        }
      };

      // Toggle Play/Pause
      const handleTogglePlay = () => {
        if (isPlaying) {
          if (audioRef.current) audioRef.current.pause();
          synthPlayer.stop();
          setIsPlaying(false);
        } else {
          if (audioRef.current && audioRef.current.src) {
            audioRef.current.play().catch(() => synthPlayer.start());
          } else {
            synthPlayer.start();
          }
          setIsPlaying(true);
        }
      };

      // Toggle Mute/Unmute
      const handleToggleMute = () => {
        const nextMute = !isMuted;
        setIsMuted(nextMute);
        if (audioRef.current) {
          audioRef.current.muted = nextMute;
        }
        if (nextMute) {
          synthPlayer.stop();
        } else if (isPlaying) {
          if (audioRef.current && audioRef.current.paused) {
            synthPlayer.start();
          }
        }
      };

      // -------------------------------------------------------------
      // STEP 0 -> STEP 1: Select User & Start Audio
      // -------------------------------------------------------------
      const handleSelectMember = (user) => {
        setSelectedUser(user);
        setCurrentStep(1);
        startUserAudio(user);
        fireConfetti();
      };

      // -------------------------------------------------------------
      // STEP 1 -> STEP 2: Advance to Govardhan Pooja
      // -------------------------------------------------------------
      const handleAdvanceToGovardhan = () => {
        setCurrentStep(2);
        fireConfetti();
      };

      // -------------------------------------------------------------
      // STEP 2 -> STEP 3: Advance to Bhai Dooj
      // -------------------------------------------------------------
      const handleAdvanceToBhaiDooj = () => {
        setCurrentStep(3);
        fireConfetti();
      };

      // -------------------------------------------------------------
      // STEP 3 Action: "Shuruat Se Dekhein" (Reset step, user & audio)
      // -------------------------------------------------------------
      const handleStartOver = () => {
        if (audioRef.current) {
          audioRef.current.pause();
          audioRef.current.currentTime = 0;
        }
        synthPlayer.stop();
        setIsPlaying(false);
        setSelectedUser(null);
        setCurrentStep(0);

                <span>🐄</span>
                <span>Govardhan</span>
